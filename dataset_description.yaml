data_scope:
  total_images: 2095
  total_annotations: 9834
  splits:
    train:
      images: 1676
      annotations: 7823
      percentage: "~80%"
    val:
      images: 209
      annotations: 923
      percentage: "~10%"
    test:
      images: 210
      annotations: 1088
      percentage: "~10%"
  image_resolution_range:
    width_min: 454
    width_max: 2876
    height_min: 224
    height_max: 1646
  annotation_tool: "LabelImg"

class_definitions:
  - class_id: 0
    name: "Missing Teeth"
    annotation_count: 2609
    percentage: 26.53
    description: "Congenitally missing or previously extracted permanent teeth visible in the panoramic radiograph."
  - class_id: 1
    name: "Dental Crown"
    annotation_count: 1984
    percentage: 20.17
    description: "Prosthetic dental crowns (full-coverage restorations) placed on individual teeth."
  - class_id: 2
    name: "Root Canal"
    annotation_count: 1956
    percentage: 19.89
    description: "Endodontically treated teeth exhibiting radiopaque root-canal filling material."
  - class_id: 3
    name: "Caries"
    annotation_count: 1410
    percentage: 14.34
    description: "Carious lesions presenting as radiolucent areas in enamel and/or dentin."
  - class_id: 4
    name: "Broken Down Teeth"
    annotation_count: 795
    percentage: 8.08
    description: "Teeth with extensive structural loss (large cavities, fractures, coronal destruction) not restorable with simple restorations."
  - class_id: 5
    name: "Wisdom Teeth"
    annotation_count: 869
    percentage: 8.84
    description: "Third molars (wisdom teeth), regardless of eruption status."
  - class_id: 6
    name: "Healthy OPG"
    annotation_count: 211
    percentage: 2.15
    description: "Image-level bounding box covering the visible dentition region in radiographs with no pathology present."

annotation_schema:
  primary_format: "COCO (instances_{train,val,test}.json)"
  secondary_format: "YOLO (labels_yolo/{train,val,test}/*.txt)"
  bbox_mode: "xywh  # x_min, y_min, width, height in pixel coordinates (COCO); normalized xc,yc,w,h (YOLO)"
  segmentation: false
  iscrowd: 0
  class_ids_present: [0, 1, 2, 3, 4, 5, 6]
  quality_control:
    - "Manual annotation using LabelImg"
    - "Initial annotation performed by an experienced dentist"
    - "Independent verification by a second dentist"
    - "Quality assurance and label refinement"
    - "Removal of inaccurate or invalid bounding boxes"

image_modality: "Orthopantomogram (OPG) — dental panoramic radiograph"
image_file_format: "JPG (with a small number of JPEG variants)"
image_rel_path_prefix: "images/{split}/{file_name}"

label_yolo_format: "class_id x_center y_center width height — values normalized to [0,1] relative to true image W/H; per-split files in labels_yolo/{split}/"

intended_applications:
  - "Dental object detection"
  - "Dental disease localization"
  - "Computer-aided diagnosis (CAD)"
  - "Deep learning research"
  - "Medical image analysis"
  - "YOLO model training"
  - "Transfer learning"
  - "Benchmark evaluation"
  - "Educational purposes"

ethics_statement: >
  All radiographs were retrospectively collected. Ethical approval was
  obtained where required by the participating institutions. All
  patient-identifying information was removed before annotation. Images are
  fully anonymized prior to public release. The dataset contains no personally
  identifiable information (PII).

