name: MOPG-7
full_name: MOPG-7 — A Multi-Clinic Dental Panoramic Radiograph Dataset with Expert YOLO Labels
version: "v4.0"
release_date: "2026"
description: >
  MOPG-7 is a publicly available multi-clinic dataset containing 2,095 fully
  anonymized dental panoramic radiographs (Orthopantomograms, OPGs) with
  expert-annotated YOLO and COCO-format bounding-box labels for seven
  clinically relevant dental conditions. The database was retrospectively
  collected from four independent dental centers in Bangladesh, providing
  diversity in patient demographics, imaging devices, and clinical cases.

